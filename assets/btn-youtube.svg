<style>@font-face{font-family:'TZ Display';font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'TZ Display';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'TZ Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'TZ Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}.d{font-family:'TZ Display','Segoe UI Black', 'Arial Black', sans-serif}.s{font-family:'TZ Sans','Segoe UI', 'Helvetica Neue', Arial, sans-serif}.m{font-family:'TZ Mono',Consolas, Menlo, 'DejaVu Sans Mono', monospace}@keyframes run{to{stroke-dashoffset:-1000}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.pulse{animation:pulse 1.6s ease-in-out infinite}.sh{animation:sh 4.5s ease-in-out infinite}@keyframes sh{0%,55%{transform:translateX(-120px) skewX(-20deg)}100%{transform:translateX(420px) skewX(-20deg)}}</style>
