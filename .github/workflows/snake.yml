name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually too
  push:
    branches:
      - main                # regenerates whenever you push to your profile repo

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: farzeen-ali
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake-techzeen-dark.svg?palette=github-dark&color_snake=#ff3df2&color_dots=#161b22,#3b0a75,#6d28d9,#8b3dff,#d8b4fe
            dist/snake-techzeen-light.svg?color_snake=#7e15f7&color_dots=#ebedf0,#e9d5ff,#c084fc,#9333ea,#6b21a8

      - name: Push snake output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
