name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually too
  push:
    branches:
      - main                # regenerates whenever you push to your profile repo

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: farzeen-ali
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/snake-techzeen-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#12151f,#0a1248,#2239e0,#2b47ff,#96a6ff
            dist/snake-techzeen-light.svg?color_snake=#2b47ff&color_dots=#ebedf0,#cdd5ff,#96a6ff,#6077ff,#2239e0

      - name: Push snake output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
